<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda · Allenatore</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Agenda Coach">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --bg:#f4f1ec; --card:#fff; --ink:#16181d; --mute:#6b6f78; --line:#e6e1d9; --soft:#faf8f5;
    --acc:#e8642c; --ok:#1f9d62; --okb:#e1f4ea; --warn:#c98a0b; --warnb:#fbf0d6; --bad:#d23c3c; --badb:#fbe3e3; --ill:#7a5bd0; --illb:#eee8fb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:14px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px 40px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding:24px 0 14px}
  h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--mute);font-size:13px}
  nav{display:flex;flex-wrap:wrap;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
  nav button{border:0;background:none;font:inherit;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--mute)}
  nav button.on{background:var(--ink);color:#fff}
  .datebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 16px}
  .datebar button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--ink)}
  .datebar .d{font-size:18px;font-weight:700;min-width:210px}
  .datebar .today{width:auto;padding:0 12px;font:inherit;font-weight:600}
  .datebar .tag{margin-left:auto;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .kpi .l{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
  .kpi .v{font-size:28px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
  .kpi .v small{font-size:14px;color:var(--mute);font-weight:500}
  .kpi .n{font-size:12.5px;color:var(--mute);margin-top:2px}
  .bar{height:6px;background:var(--soft);border-radius:4px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}
  .ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .ph h2{margin:0;font-size:16px}
  .pb{padding:16px}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;white-space:nowrap}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;text-align:center;padding:10px 8px;background:var(--soft)}
  th:first-child,td:first-child{text-align:left;padding-left:16px}
  td{padding:10px 8px;border-top:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
  tr.click{cursor:pointer} tr.click:hover td{background:#fcfbf9}
  .nm{font-weight:700} .nm small{display:block;font-weight:400;color:var(--mute);font-size:12px}
  .c{display:inline-block;min-width:30px;padding:3px 6px;border-radius:7px;font-weight:700}
  .g{background:var(--okb);color:var(--ok)} .y{background:var(--warnb);color:var(--warn)} .r{background:var(--badb);color:var(--bad)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600}
  .pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .p-ok{background:var(--okb);color:var(--ok)} .p-lim{background:var(--warnb);color:var(--warn)}
  .p-inj{background:var(--badb);color:var(--bad)} .p-ill{background:var(--illb);color:var(--ill)} .p-no{background:var(--soft);color:var(--mute)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line)} .dot.on{background:var(--ok)}
  .muted{color:var(--mute)}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .row label{font-size:12px;color:var(--mute);font-weight:600}
  input,select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--soft);color:var(--ink)}
  input.num{width:64px;text-align:center}
  .btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 14px;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
  .btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
  .btn.acc{background:var(--acc)}
  .btn:disabled{opacity:.4}
  .ov{position:fixed;inset:0;background:rgba(22,24,29,.35);display:flex;justify-content:flex-end;z-index:5}
  .dr{width:min(440px,100%);height:100%;background:var(--card);padding:22px 20px;overflow:auto}
  .dr h3{margin:0;font-size:22px} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .fld label{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-bottom:4px}
  .fld input,.fld select{width:100%}
  .sec{margin-top:18px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:700}
  svg text{font-family:Archivo,system-ui,sans-serif}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:9;pointer-events:none}
  .toast.show{opacity:1}
  .loading{padding:60px;text-align:center;color:var(--mute)}
  .login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px}
  .login h1{margin-bottom:6px} .login input{width:100%;margin-top:12px;padding:12px}
  .login .btn{width:100%;margin-top:16px;padding:13px}
  .err{color:var(--bad);font-weight:600;margin-top:10px;min-height:18px}
  /* ---------- REPORT (pagine A4) ---------- */
  .rep-wrap{background:#d9d5ce;border-radius:18px;padding:20px;overflow-x:auto}
  .page{width:794px;min-height:1123px;margin:0 auto 20px;background:#fff;color:#16181d;padding:44px 48px;font-size:11.5px;position:relative}
  .page:last-child{margin-bottom:0}
  .pdf .page{margin:0;height:1123px;overflow:hidden}
  .rh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #16181d;padding-bottom:12px;margin-bottom:18px}
  .rh .t{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .rh .s{color:#6b6f78;font-size:12px;margin-top:2px}
  .rh .b{text-align:right;font-size:11px;color:#6b6f78}
  .rh .b b{display:block;font-size:13px;color:#e8642c;letter-spacing:.06em}
  .rk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .rk div{border:1px solid #e6e1d9;border-radius:10px;padding:10px 12px}
  .rk span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:#6b6f78;font-weight:700}
  .rk b{font-size:20px;font-weight:800}
  .rk small{color:#6b6f78;font-size:10.5px}
  .rt{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px}
  .page table{white-space:nowrap}
  .page th{font-size:9px;padding:6px 5px;background:#f4f1ec}
  .page td{padding:5px 5px;font-size:11px;border-top:1px solid #eee9e1}
  .page th:first-child,.page td:first-child{padding-left:8px}
  .page .c{min-width:24px;padding:1px 5px;border-radius:5px}
  .page .pill{padding:2px 7px;font-size:10px}
  .note{border-left:3px solid #e8642c;background:#fdf3ee;padding:8px 12px;border-radius:0 8px 8px 0;margin-top:6px;line-height:1.5}
  .rf{position:absolute;left:48px;right:48px;bottom:24px;display:flex;justify-content:space-between;color:#9a9da4;font-size:9.5px;border-top:1px solid #eee9e1;padding-top:8px}
  .legend{color:#6b6f78;font-size:10px;margin-top:6px}
  .pw{display:flex;align-items:center;justify-content:center;gap:8px;margin:28px 0 8px;color:var(--mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .pw img{width:30px;height:30px;border-radius:7px;display:block}
  .rf .pb5{display:flex;align-items:center;gap:8px;color:#6b6f78;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;white-space:nowrap}
  .rf .pb5 img{width:36px;height:36px;border-radius:8px}
  .rf .rl{line-height:1.5}
  .teams{display:flex;gap:6px;margin-bottom:8px}
  .teams button{font:inherit;font-weight:800;font-size:15px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 14px;cursor:pointer;text-align:left;line-height:1.1}
  .teams button small{display:block;font-size:10.5px;font-weight:600;color:var(--mute)}
  .teams button.on{background:var(--c);border-color:var(--c);color:#fff}
  .teams button.on small{color:rgba(255,255,255,.8)}
  nav button.on{background:var(--team,var(--ink))}
  .dr.wide{width:min(1100px,100%)}
  .pl td{padding:6px 6px} .pl input.num{width:58px;padding:6px}
  .sqtag{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
  .chip{font:inherit;font-size:12px;font-weight:700;border:1.5px solid var(--line);background:var(--soft);color:var(--mute);border-radius:999px;padding:4px 10px;cursor:pointer;margin-right:4px}
  .chip.on{color:#fff;border-color:transparent}
  /* ---------- MODALITÀ MARLA (easter egg) ---------- */
  .eggbtn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;line-height:1;transition:transform .2s}
  .eggbtn.on{background:#1b2a3d;border-color:#1b2a3d;transform:rotate(-12deg)}
  .hrow{display:flex;align-items:center;gap:10px}
  .saluto{font-size:13px;color:var(--acc);font-weight:600;margin-top:4px}
  .alp{position:fixed;left:0;right:0;bottom:0;height:42vh;pointer-events:none;z-index:0;opacity:0;transition:opacity .6s}
  body.egg .alp{opacity:1}
  .wrap,#drawer,.toast{position:relative;z-index:1}
  .toast{position:fixed}
  .alt{font-size:12px;font-weight:700;color:#4a6a8a;background:#e6eef5;border-radius:999px;padding:5px 10px}
  .peek{position:fixed;bottom:-200px;left:50%;width:170px;margin-left:-85px;z-index:20;transition:bottom .5s cubic-bezier(.3,1.5,.6,1);pointer-events:none}
  .peek.up{bottom:-40px}
  .corsa{position:fixed;bottom:18px;left:-180px;z-index:20;pointer-events:none;display:flex;align-items:flex-end;gap:4px;animation:corsa 4.2s linear forwards}
  .corsa .h{width:120px;animation:testa .35s ease-in-out infinite alternate}
  .corsa .b{width:46px;animation:palleggio .42s cubic-bezier(.5,0,.5,1) infinite alternate}
  @keyframes corsa{to{left:calc(100% + 40px)}}
  @keyframes testa{to{transform:translateY(-6px) rotate(3deg)}}
  @keyframes palleggio{from{transform:translateY(-70px)}to{transform:translateY(0)}}
  .timbro{position:fixed;left:50%;top:38%;z-index:30;transform:translate(-50%,-50%) rotate(-8deg) scale(.3);opacity:0;pointer-events:none;
    border:5px solid #e8642c;color:#e8642c;border-radius:16px;padding:14px 26px;font-size:30px;font-weight:800;background:rgba(255,255,255,.92);
    transition:all .35s cubic-bezier(.3,1.6,.6,1);text-align:center}
  .timbro small{display:block;font-size:13px;color:#6b6f78;font-weight:600;margin-top:2px}
  .timbro.show{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}
  .zampa{position:fixed;top:-40px;z-index:25;font-size:24px;pointer-events:none;animation:cade linear forwards}
  @keyframes cade{to{transform:translateY(110vh) rotate(260deg)}}
  @media (max-width:640px){ .datebar .d{min-width:0;font-size:16px} .datebar .tag{margin-left:0} }
</style>
</head>

/* ---------- LOGIN ---------- */
async function start(){
  if (SUPABASE_URL.startsWith('INCOLLA')) { $('#root').innerHTML = '<div class="login"><h1>Configurazione</h1><p class="sub">Apri staff.html con un editor di testo e incolla Project URL e anon key di Supabase in cima allo script.</p></div>'; return; }
  const { data } = await sb.auth.getSession();
  if (data.session) return enter();
  showLogin();
}
function showLogin(msg){
  $('#root').innerHTML = `<form class="login" onsubmit="doLogin(event)">
    <div class="sub">Monitoraggio basket</div><h1>Agenda · Staff</h1>
    <input type="email" id="em" placeholder="Email" autocomplete="username" required>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" type="submit">Entra</button><div class="err" id="err">${esc(msg || '')}</div></form>${poweredBy()}`;
}
async function doLogin(e){
  e.preventDefault();
  $('#err').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
  if (error) { $('#err').textContent = 'Email o password non corrette.'; return; }
  enter();
}
async function enter(){
  let { data: ruolo, error: eR } = await sb.rpc('ruolo_utente');
  if (eR) { const r = await sb.rpc('is_staff'); ruolo = r.data ? 'staff' : null; }
  if (RO ? !ruolo : ruolo !== 'staff') { await sb.auth.signOut(); return showLogin(RO ? 'Questo account non è abilitato alla vista allenatore.' : 'Questo account non è abilitato come staff.'); }
  if (RO) EGG = false;
  $('#root').innerHTML = `<div class="wrap"><header>
    <div><div class="teams" id="teams"></div>
      <div class="hrow"><h1 id="titolo">Agenda · ${RO ? 'Allenatore' : 'Staff'}</h1>${RO ? '' : `<button class="eggbtn${EGG ? ' on' : ''}" id="eggBtn" onclick="toggleEgg()" title="Modalità Marla">🐾</button>`}</div>
      <div class="saluto" id="saluto">${RO ? '<span style="color:var(--mute)">👁 Vista in sola lettura</span>' : ''}</div></div>
    <nav>
      <button data-v="giorno" class="on">Giornata</button><button data-v="squadra">Carichi</button>
      <button data-v="prog">Programmazione</button>${RO ? '' : '<button data-v="atleti">Atleti</button>'}
      <button data-v="report">Report PDF</button><button data-v="esci">Esci</button>
    </nav></header><div id="app"><div class="loading">Caricamento dati…</div></div>${poweredBy()}</div>`;
  document.querySelectorAll('nav button').forEach(b => b.onclick = async () => {
    if (b.dataset.v === 'esci') { await sb.auth.signOut(); return showLogin(); }
    view = b.dataset.v; document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b)); render();
  });
  $('#titolo').onclick = cliccaTitolo;
  applicaEgg();
  load();
}

/* ---------- DATI ---------- */
async function load(){
  if (EGG && !D) { const l = $('#app .loading'); if (l) l.textContent = pick(CARICAMENTI); }
  const oggi = iso(new Date());
  const da = addDays(oggi, -150);
  let a, p, g, ps, sq, as;
  if (RO) {
    const r = await sb.rpc('dati_allenatore', { p_da: da });
    if (r.error) { $('#app').innerHTML = `<div class="loading">Errore: ${esc(r.error.message)}</div>`; return; }
    a = { data: r.data.atleti }; p = { data: r.data.programmazione }; g = { data: r.data.giornaliero };
    ps = { data: [] }; sq = { data: r.data.squadre }; as = { data: r.data.atleta_squadre };
  } else [a, p, g, ps, sq, as] = await Promise.all([
    sb.from('atleti').select('*').order('id'),
    sb.from('programmazione').select('*'),
    sb.from('v_giornaliero').select('*').gte('data', da).order('data'),
    sb.from('push_sub').select('atleta_id'),
    sb.from('squadre').select('*').order('ordine'),
    sb.from('atleta_squadre').select('*')
  ]);
  const err = !RO && (a.error || p.error || g.error || sq.error || as.error);
  if (err) { $('#app').innerHTML = `<div class="loading">Errore: ${esc(err.message)}</div>`; return; }
  const righe = g.data.map(r => ({
    data: r.data, id: r.atleta_id, tqr: r.tqr, sonnoQ: r.sonno_q, sonnoH: num(r.sonno_h), doms: r.doms, stress: r.stress, disp: r.disp,
    w: r.min_w, v: r.min_v, tp: r.min_tp, g: r.min_g, tot: r.min_tot, rpe: r.rpe, au: num(r.carico_au), stato: r.stato,
    pre_at: r.pre_at, post_at: r.post_at, staff_at: r.staff_at, sq: r.squadra_giorno, sqSet: r.squadra, nota: r.nota || ''
  }));
  const idx = {}; righe.forEach(r => idx[r.data + '|' + r.id] = r);
  const prog = {}; p.data.forEach(x => (prog[x.squadra] = prog[x.squadra] || {})[x.data] = { tipo: x.tipo, rpe: num(x.rpe_obiettivo), postAperto: x.post_aperto_at, inizio: (x.ora_inizio || '').slice(0, 5), fine: (x.ora_fine || '').slice(0, 5) });
  const membriSq = {}, princ = {};
  as.data.forEach(m => { (membriSq[m.squadra_id] = membriSq[m.squadra_id] || new Set()).add(m.atleta_id); if (m.principale) princ[m.atleta_id] = m.squadra_id; });
  const push = new Set((ps.data || []).map(x => x.atleta_id));
  D = { oggi, atleti: a.data.map(x => Object.assign(x, { link: RO ? '' : ATLETA_URL + '?a=' + encodeURIComponent(x.id) + '&t=' + x.token })), righe, idx, prog, push,
        squadre: sq.data, membri: membriSq, princ };
  if (!D.squadre.some(x => x.id === SQ)) SQ = (D.squadre[0] || { id: 'U19' }).id;
  if (!cur) cur = oggi;
  if (!repAtleta || !membri().some(x => x.id === repAtleta)) repAtleta = (membri()[0] || D.atleti[0] || {}).id;
  renderTeams();
  render();
}
async function salvaRighe(list){
  const rows = list.map(o => Object.assign(o, { staff_at: new Date().toISOString() }));
  const { error } = await sb.from('giornaliero').upsert(rows, { onConflict: 'data,atleta_id' });
  if (error) throw error;
}
function renderTeams(){
  document.body.style.setProperty('--team', COL_SQ[SQ] || '#e8642c');
  const t = $('#teams'); if (!t) return;
  t.innerHTML = D.squadre.map(x => `<button class="${x.id === SQ ? 'on' : ''}" style="--c:${COL_SQ[x.id] || '#16181d'}" onclick="cambiaSquadra('${esc(x.id)}')">${esc(x.id)}<small>${(D.membri[x.id] || new Set()).size} giocatori</small></button>`).join('');
}
function cambiaSquadra(id){
  SQ = id; try { localStorage.setItem('agenda_sq', id); } catch (_) {}
  if (!membri().some(x => x.id === repAtleta)) repAtleta = (membri()[0] || {}).id;
  renderTeams(); closeDr(); render();
}
function render(){ ({ giorno: vGiorno, squadra: vSquadra, prog: vProg, atleti: vAtleti, report: vReport })[view](); if (view === 'giorno') controllaApprovazione(); }

/* ---------- semafori ---------- */
const col = {
  tqr: v => v == null ? '' : v <= 5 ? 'r' : v <= 7 ? 'y' : 'g',
  sonnoQ: v => v == null ? '' : v <= 2 ? 'r' : v === 3 ? 'y' : 'g',
  sonnoH: v => v == null ? '' : v < 6.5 ? 'r' : v < 7.5 ? 'y' : 'g',
  doms: v => v == null ? '' : v >= 4 ? 'r' : v >= 3 ? 'y' : 'g',
  stress: v => v == null ? '' : v >= 4 ? 'r' : v >= 3 ? 'y' : 'g'
};
const cell = (k, v, d) => v == null ? '<span class="muted">–</span>' : `<span class="c ${col[k](v)}">${fmtN(v, d ?? (k === 'sonnoH' ? 1 : 0))}</span>`;
function pill(d){
  const m = { 'Disponibile': 'p-ok', 'Disponibile con limitazioni': 'p-lim', 'Infortunato': 'p-inj', 'Ammalato': 'p-ill' };
  const t = d === 'Disponibile con limitazioni' ? 'Con limitazioni' : d;
  return d ? `<span class="pill ${m[d] || 'p-no'}"><i></i>${esc(t)}</span>` : '<span class="pill p-no">Non compilato</span>';
}
function kpi(l, v, n, frac){
  return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${n ? `<div class="n">${n}</div>` : ''}
    ${frac != null ? `<div class="bar"><i style="width:${Math.round(frac * 100)}%"></i></div>` : ''}</div>`;
}
function go(n){ cur = addDays(cur, n); render(); }
function datebar(label, step, extra){
  return `<div class="datebar"><button onclick="go(-${step})">‹</button><div class="d">${label}</div><button onclick="go(${step})">›</button>
    <button class="today" onclick="cur=D.oggi;render()">Oggi</button>${EGG ? '<span class="alt">⛰️ 1001 m s.l.m.</span>' : ''}${extra || ''}</div>`;
}

/* ---------- calcoli ---------- */
function giorno(k){
  const A = D.atleti.filter(a => a.attivo && squadreDi(a.id).includes(SQ) && sqDi(a.id, k) === SQ), R = A.map(a => ({ a, r: row(k, a.id) || {} }));
  const rpes = R.map(x => num(x.r.rpe)).filter(v => v != null), aus = R.map(x => num(x.r.au)).filter(v => v != null);
  const p = P(k);
  return {
    A, R, p, rpes, aus,
    pre: R.filter(x => num(x.r.tqr) != null).length, post: R.filter(x => num(x.r.rpe) != null).length,
    disp: R.filter(x => x.r.disp && !ND.includes(x.r.disp)).length,
    nd: R.filter(x => ND.includes(x.r.disp)),
    tqr: avg(R.map(x => num(x.r.tqr)).filter(v => v != null)),
    diff: avg(rpes) != null && p.rpe != null ? avg(rpes) - p.rpe : null
  };
}
function metrics(id, end){
  const au = k => num((row(k, id) || {}).au) || 0;
  const d7 = [...Array(7)].map((_, i) => au(addDays(end, -i))), d28 = [...Array(28)].map((_, i) => au(addDays(end, -i)));
  const s7 = sum(d7), m7 = s7 / 7, m28 = sum(d28) / 28;
  const sd = Math.sqrt(d7.reduce((a, b) => a + (b - m7) ** 2, 0) / 7);
  const mono = sd > 0 ? m7 / sd : null;
  const w = k => row(k, id) || {};
  const last7 = [...Array(7)].map((_, i) => w(addDays(end, -i)));
  const media = f => avg(last7.map(r => num(r[f])).filter(v => v != null));
  const giorni = D.righe.filter(r => r.id === id && num(r.au) != null && r.data <= end && r.data > addDays(end, -28)).length;
  return { s7, acwr: m28 > 0 ? m7 / m28 : null, mono, strain: mono != null ? s7 * mono : null,
    tqr: media('tqr'), sonnoH: media('sonnoH'), doms: media('doms'), stress: media('stress'), rpe: media('rpe'),
    min: sum(last7.map(r => num(r.tot) || 0)), nd: last7.filter(r => ND.includes(r.disp)).length, giorni };
}
function flags(r){
  const f = [];
  if (num(r.tqr) != null && r.tqr <= 5) f.push('recupero basso (TQR ' + r.tqr + ')');
  if (num(r.sonnoH) != null && r.sonnoH < 6.5) f.push('dormito ' + fmtN(r.sonnoH, 1) + ' h');
  if (num(r.sonnoQ) != null && r.sonnoQ <= 2) f.push('sonno di scarsa qualità');
  if (num(r.doms) != null && r.doms >= 4) f.push('DOMS ' + r.doms);
  if (num(r.stress) != null && r.stress >= 4) f.push('stress ' + r.stress);
  if (r.disp === 'Disponibile con limitazioni') f.push('disponibile con limitazioni');
  return f;
}
const acwCls = v => v == null ? '' : v > 1.5 ? 'r' : v > 1.3 || v < 0.8 ? 'y' : 'g';

/* ---------- POST: apertura e notifica ---------- */
function pannelloPost(G){
  const ap = G.p.postAperto, ora = ap ? new Date(ap).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) : '';
  const daFare = G.R.filter(x => num(x.r.rpe) == null && !ND.includes(x.r.disp));
  const conNotifica = daFare.filter(x => D.push.has(x.a.id)).length;
  const passato = cur < addDays(D.oggi, -1);
  return `<div class="panel"><div class="ph">
    <div><h2>${ap ? '🔓 POST aperto' : '🔒 POST chiuso'}</h2>
      <div class="sub" style="margin-top:4px">${ap
        ? `Aperto alle ${ora} · mancano ${daFare.length} POST${RO ? '' : ` (${conNotifica} con notifiche attive)`}`
        : passato ? 'Giornata passata: gli atleti possono compilare solo oggi e ieri.'
        : G.p.tipo === 'RIPOSO' ? 'Giornata di riposo: nessuna notifica automatica.'
        : G.p.fine ? `Allenamento ${G.p.inizio || '?'}–${G.p.fine}: si apre da solo alle <b>${autoPost(G.p.fine)}</b>${RO ? '.' : ' e avvisa i presenti. Puoi anche aprirlo prima.'}`
        : RO ? 'Il POST si apre a fine allenamento.' : 'Imposta l\'orario in Programmazione per l\'apertura automatica, oppure aprilo tu a fine allenamento.'}</div></div>
    <div class="row">${RO ? '' : ap
      ? `<button class="btn ghost" onclick="avvisaPost()" ${daFare.length ? '' : 'disabled'}>Avvisa di nuovo</button><button class="btn ghost" onclick="apriPost(false)">Richiudi</button>`
      : `<button class="btn acc" onclick="apriPost(true)" ${passato ? 'disabled' : ''}>Apri POST e avvisa gli atleti</button>`}</div>
  </div></div>`;
}
const sqTag = (id, pre) => `<span class="sqtag" style="background:${COL_SQ[id] || '#6b6f78'}">${pre || ''}${esc(id)}</span>`;
const autoPost = f => { const [h, m] = f.split(':').map(Number), x = h * 60 + m - 20; return String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0'); };
async function apriPost(aperto){
  if (RO) return;
  const { error } = await sb.rpc('apri_post', { p_data: cur, p_squadra: SQ, p_aperto: aperto });
  if (error) return toast('Errore: ' + error.message);
  if (!aperto) { toast('POST richiuso'); return load(); }
  await load();
  avvisaPost(true);
}
async function avvisaPost(primaVolta){
  toast('Invio notifiche…');
  try {
    const { data, error } = await sb.functions.invoke('Notifica-post', { body: { data: cur, squadra: SQ } });
    if (error) throw error;
    toast((primaVolta ? 'POST aperto · ' : '') + (data.atleti ? 'notifica inviata a ' + data.atleti + (data.atleti === 1 ? ' atleta' : ' atleti') : 'nessun atleta con notifiche attive da avvisare'));
  } catch (e) {
    let det = e.message || String(e);
    try { if (e.context && e.context.status) det = 'errore ' + e.context.status + ': ' + (await e.context.text()).slice(0, 140); } catch (_) {}
    toast((primaVolta ? 'POST aperto, ma ' : '') + 'notifiche non inviate · ' + det, 9000);
  }
}

async function bulk(){
  if (RO) return;
  const v = { w: $('#bW').value, v: $('#bV').value, tp: $('#bTP').value, g: $('#bG').value };
  const cols = { w: 'min_w', v: 'min_v', tp: 'min_tp', g: 'min_g' };
  const keys = Object.keys(v).filter(k => v[k] !== '');
  if (!keys.length) return toast('Inserisci almeno un valore');
  if (keys.some(k => !(+v[k] >= 0))) return toast('Minuti non validi');
  const ids = giorno(cur).A.filter(a => !ND.includes((row(cur, a.id) || {}).disp)).map(a => a.id);
  try {
    await salvaRighe(ids.map(id => { const o = { data: cur, atleta_id: id }; keys.forEach(k => o[cols[k]] = +v[k]); return o; }));
    okToast('Minuti salvati per ' + ids.length + ' atleti'); load();
  } catch (e) { toast('Errore: ' + e.message); }
}

async function saveDr(id){

/* ---------- grafici (SVG) ---------- */
function chartAtleta(id, end, W, H, fixed){
  const days = [...Array(28)].map((_, i) => addDays(end, i - 27));
  const au = days.map(k => num((row(k, id) || {}).au) || 0), tq = days.map(k => num((row(k, id) || {}).tqr));
  const mx = Math.max(1, ...au), bw = W / 28, ch = H - 30;
  const bars = au.map((v, i) => `<rect x="${(i * bw + 1).toFixed(1)}" y="${(H - 20 - (v / mx) * ch).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${((v / mx) * ch).toFixed(1)}" rx="2" fill="${days[i] === end ? '#e8642c' : '#16181d'}" opacity="${days[i] === end ? 1 : .8}"/>`).join('');
  const pts = tq.map((v, i) => v == null ? null : `${(i * bw + bw / 2).toFixed(1)},${(H - 20 - (v / 10) * ch).toFixed(1)}`).filter(Boolean).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" ${fixed ? `width="${W}" height="${H}"` : 'width="100%"'}><g>${bars}</g>
    <polyline points="${pts}" fill="none" stroke="#1f9d62" stroke-width="2"/>
    <text x="0" y="${H - 4}" font-size="11" fill="#6b6f78">Barre: carico AU · Linea verde: TQR (0-10) · ${dLabel(days[0], { day: 'numeric', month: 'short' })} – ${dLabel(end, { day: 'numeric', month: 'short' })}</text></svg>`;
}
function chartSquadra(days, W, H, opt){
  opt = opt || {};
  const team = days.map(k => avg(D.righe.filter(r => r.data === k && r.sq === SQ && num(r.au) != null).map(r => +r.au)) || 0);
  const mx = Math.max(1, ...team), bw = W / days.length, ch = H - 50;
  return `<svg viewBox="0 0 ${W} ${H}" ${opt.fixed ? `width="${W}" height="${H}"` : 'width="100%"'}>${team.map((v, i) => `<rect x="${(i * bw + 4).toFixed(1)}" y="${(H - 30 - (v / mx) * ch).toFixed(1)}" width="${(bw - 8).toFixed(1)}" height="${((v / mx) * ch).toFixed(1)}" rx="4" fill="${days[i] === opt.hi ? '#e8642c' : '#16181d'}"/>
    <text x="${(i * bw + bw / 2).toFixed(1)}" y="${H - 12}" font-size="${opt.fs || 12}" text-anchor="middle" fill="#6b6f78">${opt.lab ? opt.lab(days[i]) : dLabel(days[i], { day: 'numeric' })}</text>
    ${v ? `<text x="${(i * bw + bw / 2).toFixed(1)}" y="${(H - 36 - (v / mx) * ch).toFixed(1)}" font-size="${(opt.fs || 12) - 1}" text-anchor="middle" fill="#16181d">${Math.round(v)}</text>` : ''}`).join('')}</svg>`;
}

/* ---------- CARICHI ---------- */

/* ---------- PROGRAMMAZIONE ---------- */
const TIPI = ['ALLENAMENTO', 'GARA', 'RIPOSO'];
function vProg(){
  const lun = lunedi(cur), days = [...Array(14)].map((_, i) => addDays(lun, i));
  $('#app').innerHTML = `
  ${datebar('Settimane dal ' + dLabel(lun, { day: 'numeric', month: 'long' }) + ' · ' + esc(nomeSq(SQ)), 7)}
  <div class="panel"><div class="ph"><h2>Programmazione ${esc(SQ)}</h2><span class="sub">${RO ? 'Tocca <b>Giocatori</b> per vedere W / V / TP / G previsti per ognuno' : 'Tocca <b>Giocatori</b> per impostare W / V / TP / G di ognuno e con quale squadra si allena chi fa doppio campionato'}</span></div>
  <div class="scroll"><table><tr><th>Giorno</th><th>Tipo</th><th>Inizio</th><th>Fine</th><th>RPE obiettivo</th><th>Giocatori</th><th>RPE medio</th><th>Diff.</th><th></th></tr>
  ${days.map(k => { const p = P(k); const G = giorno(k);
    const m = avg(G.R.map(x => num(x.r.rpe)).filter(v => v != null));
    const df = m != null && p.rpe != null ? m - p.rpe : null;
    const prog = G.R.filter(x => num(x.r.tot) != null).length;
    const ospiti = G.A.filter(a => !(D.princ[a.id] === SQ)).length;
    return `<tr><td class="nm">${cap(dLabel(k, { weekday: 'short', day: 'numeric', month: 'short' }))}</td>
      ${RO ? `<td><b>${esc(p.tipo || '–')}</b></td><td>${p.inizio || '–'}</td><td>${p.fine || '–'}</td><td>${p.rpe ?? '–'}</td>` : `
      <td><select id="t_${k}"><option></option>${TIPI.map(t => `<option ${t === p.tipo ? 'selected' : ''}>${t}</option>`).join('')}</select></td>
      <td><input type="time" id="i_${k}" value="${p.inizio || ''}"></td>
      <td><input type="time" id="f_${k}" value="${p.fine || ''}" title="Il POST si apre da solo 20' prima"></td>
      <td><input class="num" type="number" min="0" max="10" step="0.5" id="r_${k}" value="${p.rpe ?? ''}"></td>`}
      <td><button class="btn ghost" onclick="pianifica('${k}')">${prog ? prog + '/' + G.A.length : G.A.length} giocatori ›</button>${ospiti ? '<br><small class="muted">' + ospiti + ' da altra squadra</small>' : ''}</td>
      <td>${fmtN(m, 1)}</td><td>${df == null ? '–' : `<span class="c ${Math.abs(df) > 1.5 ? 'r' : Math.abs(df) > 0.75 ? 'y' : 'g'}">${df >= 0 ? '+' : ''}${fmtN(df, 1)}</span>`}</td>
      <td>${RO ? '' : `<button class="btn ghost" onclick="saveProg('${k}')">Salva</button>`}</td></tr>`; }).join('')}
  </table></div></div>`;
}
async function saveProg(k){
  if (RO) return;
  const t = $('#t_' + k).value || null, r = $('#r_' + k).value, i = $('#i_' + k).value || null, f = $('#f_' + k).value || null;
  const { error } = await sb.from('programmazione').upsert({ data: k, squadra: SQ, tipo: t, rpe_obiettivo: r === '' ? null : +r, ora_inizio: i, ora_fine: f }, { onConflict: 'data,squadra' });
  if (error) return toast('Errore: ' + error.message);
  okToast('Programmazione salvata'); load();
}

  $('#drawer').innerHTML = `<div class="ov" onclick="if(event.target===this)closeDr()"><div class="dr wide">
    <div class="sub">${esc(nomeSq(SQ))} · ${esc(p.tipo || 'giornata non programmata')}${p.inizio ? ' · ' + p.inizio + '–' + (p.fine || '?') : ''}</div>

function pianifica(k){
  if (RO) return pianificaRO(k);
  const p = P(k);
  const lista = membri().sort((a, b) => (doppio(a.id) - doppio(b.id)) || a.nome.localeCompare(b.nome));
  $('#drawer').innerHTML = `<div class="ov" onclick="if(event.target===this)closeDr()"><div class="dr wide">
    <div class="sub">${esc(nomeSq(SQ))} · ${esc(p.tipo || 'giornata non programmata')}${p.inizio ? ' · ' + p.inizio + '–' + (p.fine || '?') : ''}</div>
    <h3>${cap(dLabel(k))}</h3>
    <div class="sub" style="margin-top:6px">Minuti previsti per ogni giocatore: W = Weights · V = Vitamins · TP = Team practice · G = Game. Il carico AU si calcola con l'RPE del POST.</div>
    <div class="scroll" style="margin-top:14px"><table class="pl">
      <tr><th>Giocatore</th><th>Si allena con</th>${MIN.map(m => `<th title="${m[3]}">${m[2]}</th>`).join('')}<th>Tot</th><th style="text-align:left">Nota per l'atleta <small class="muted">(la vede solo lui)</small></th></tr>
      <tr style="background:var(--soft)"><td class="nm">Tutti<small>compila e premi ↓</small></td><td></td>
        ${MIN.map(m => `<td><input class="num" type="number" min="0" inputmode="numeric" id="all_${m[0]}"></td>`).join('')}
        <td><button class="btn ghost" style="padding:6px 10px" onclick="copiaTutti()">↓ Copia</button></td><td></td></tr>
      ${lista.map(a => { const r = row(k, a.id) || {}; const sqs = squadreDi(a.id); const qui = sqDi(a.id, k);
        return `<tr data-id="${esc(a.id)}"${qui !== SQ ? ' style="opacity:.55"' : ''}>
          <td class="nm">${esc(a.nome)}<small>${esc(a.id)}${ND.includes(r.disp) ? ' · ' + esc(r.disp.toLowerCase()) : ''}</small></td>
          <td>${sqs.length > 1 ? `<select data-k="sq" onchange="this.closest('tr').style.opacity = this.value === SQ ? 1 : .55">${sqs.map(x => `<option value="${esc(x)}" ${x === qui ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>` : sqTag(sqs[0])}</td>
          ${MIN.map(m => `<td><input class="num" type="number" min="0" inputmode="numeric" data-k="${m[0]}" value="${r[m[0]] ?? ''}" oninput="totRiga(this)"></td>`).join('')}
          <td><b class="tot">${num(r.tot) ?? '–'}</b></td>
          <td><input data-k="nota" maxlength="500" value="${esc(r.nota || '')}" placeholder="es. porta le scarpe da corsa" style="width:230px"></td></tr>`; }).join('')}
    </table></div>
    <div class="sub" style="margin-top:8px">I giocatori in grigio quel giorno si allenano con l'altra squadra: compaiono nella sua Giornata.</div>
    <div style="display:flex;gap:8px;margin-top:18px"><button class="btn" onclick="salvaPiano('${k}')">Salva programmazione</button><button class="btn ghost" onclick="closeDr()">Annulla</button></div>
  </div></div>`;
}
function totRiga(el){
  const tr = el.closest('tr'), v = [...tr.querySelectorAll('input.num[data-k]')].map(i => num(i.value) || 0), t = sum(v);
  tr.querySelector('.tot').textContent = t || '–';
}
function copiaTutti(){
  MIN.forEach(m => { const v = $('#all_' + m[0]).value; if (v === '') return;
    document.querySelectorAll('.pl tr[data-id]').forEach(tr => { const sel = tr.querySelector('select[data-k=sq]'); if (sel && sel.value !== SQ) return;
      const i = tr.querySelector(`input[data-k=${m[0]}]`); i.value = v; totRiga(i); }); });
}
async function salvaPiano(k){
  if (RO) return;
  const rows = [...document.querySelectorAll('.pl tr[data-id]')].map(tr => {
    const o = { data: k, atleta_id: tr.dataset.id };
    const sel = tr.querySelector('select[data-k=sq]');
    o.squadra = sel ? sel.value : null;
    MIN.forEach(m => { const v = tr.querySelector(`input[data-k=${m[0]}]`).value; o[m[1]] = v === '' ? null : +v; });
    o.nota = tr.querySelector('input[data-k=nota]').value.trim() || null;
    return o;
  });
  const { error } = await sb.from('giornaliero').upsert(rows, { onConflict: 'data,atleta_id' });
  if (error) return toast('Errore: ' + error.message);
  okToast('Programmazione giocatori salvata'); closeDr(); load();
}

  <div class="scroll"><table><tr><th>Atleta</th><th>Squadre</th><th>Attivo</th><th>Notifiche</th><th>Link</th><th></th></tr>

    <td><input type="checkbox" ${a.attivo ? 'checked' : ''} onchange="setAttivo('${esc(a.id)}', this.checked)"></td>
    <td>${D.push.has(a.id) ? '<span class="pill p-ok"><i></i>Attive</span>' : '<span class="pill p-no">No</span>'}</td>
    <td style="text-align:left;max-width:320px;overflow:hidden;text-overflow:ellipsis" class="muted">${esc(a.link)}</td>

  <div class="panel"><div class="ph"><h2>Nuovo atleta</h2></div><div class="pb row">

    <span class="sub">Squadra: <b>${esc(SQ)}</b></span><button class="btn" onclick="nuovoAtleta()">Aggiungi</button></div></div>`;

async function setAttivo(id, v){
  const { error } = await sb.from('atleti').update({ attivo: v }).eq('id', id);
  if (error) return toast('Errore: ' + error.message);
  toast(v ? 'Atleta attivato' : 'Atleta disattivato'); load();
}
async function nuovoAtleta(){
  const id = $('#nId').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, ''), nome = $('#nNome').value.trim();
  if (!id || !nome) return toast('Inserisci ID e nome');
  const { error } = await sb.from('atleti').insert({ id, nome, categoria: SQ.toLowerCase() });
  if (error) return toast('Errore: ' + (error.code === '23505' ? 'ID già esistente (se gioca anche qui, aggiungilo dall\'altra squadra con il tasto ' + SQ + ')' : error.message));
  const r2 = await sb.from('atleta_squadre').insert({ atleta_id: id, squadra_id: SQ, principale: true });
  if (r2.error) return toast('Errore: ' + r2.error.message);
  toast('Atleta aggiunto a ' + SQ); load();
}
async function toggleSquadra(id, sq){
  const sqs = squadreDi(id);
  if (sqs.includes(sq)) {
    if (sqs.length === 1) return toast('Ogni giocatore deve avere almeno una squadra');
    const { error } = await sb.from('atleta_squadre').delete().eq('atleta_id', id).eq('squadra_id', sq);
    if (error) return toast('Errore: ' + error.message);
    if (D.princ[id] === sq) await sb.from('atleta_squadre').update({ principale: true }).eq('atleta_id', id).eq('squadra_id', sqs.find(x => x !== sq));
    toast('Tolto da ' + sq);
  } else {
    const { error } = await sb.from('atleta_squadre').insert({ atleta_id: id, squadra_id: sq, principale: false });
    if (error) return toast('Errore: ' + error.message);
    toast('Aggiunto anche a ' + sq + ': ora fa doppio campionato');
  }
  load();
}
async function setPrincipale(id, sq){
  const a = await sb.from('atleta_squadre').update({ principale: false }).eq('atleta_id', id);
  const b = await sb.from('atleta_squadre').update({ principale: true }).eq('atleta_id', id).eq('squadra_id', sq);
  if (a.error || b.error) return toast('Errore: ' + (a.error || b.error).message);
  toast('Squadra principale: ' + sq); load();
}
function copy(t){ navigator.clipboard.writeText(t).then(() => toast('Link copiato'), () => prompt('Copia il link', t)); }

/* ---------- REPORT PDF ---------- */
function vReport(){
  const tipi = [['giorno', 'Giornata'], ['settimana', 'Settimana'], ['atleta', 'Singolo atleta'], ['completo', 'Completo (tutto)']];
  $('#app').innerHTML = `
  <div class="panel"><div class="ph"><h2>Report per gli allenatori</h2>
    <div class="row">
      <select id="rTipo" onchange="repTipo=this.value;vReport()">${tipi.map(([v, l]) => `<option value="${v}" ${v === repTipo ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <input type="date" id="rData" value="${cur}" onchange="cur=this.value;vReport()">
      ${repTipo === 'atleta' ? `<select id="rAtl" onchange="repAtleta=this.value;vReport()">${membri().map(a => `<option value="${esc(a.id)}" ${a.id === repAtleta ? 'selected' : ''}>${esc(a.nome)}</option>`).join('')}</select>` : ''}
      <button class="btn acc" id="pdfBtn" onclick="scaricaPdf()">Scarica PDF</button>
    </div></div>
    <div class="pb"><div class="rep-wrap"><div id="rep">${reportHtml()}</div></div></div></div>`;
}
function reportHtml(){
  if (repTipo === 'giorno') return pagGiorno(cur);
  if (repTipo === 'settimana') return pagSettimana(cur);
  if (repTipo === 'atleta') return pagAtleta(repAtleta, cur);
  return pagGiorno(cur) + pagSettimana(cur) + attivi().map(a => pagAtleta(a.id, cur)).join('');
}
const testata = (t, s) => `<div class="rh"><div><div class="t">${t}</div><div class="s">${s}</div></div><div class="b"><b>AGENDA · ${esc(SQ)}</b>Monitoraggio carico e benessere</div></div>`;
const piede = () => `<div class="rf" style="align-items:center"><div class="rl">Generato il ${new Date().toLocaleDateString('it-IT')} · Agenda monitoraggio<br>TQR 1-10 · Sonno 1-5 · DOMS/Stress 1-5 (alto = peggio) · AU = minuti × RPE</div><div class="pb5">Powered by <img src="${LOGO_5IN}" alt="5IN"></div></div>`;
const rk = (l, v, s) => `<div><span>${l}</span><b>${v}</b>${s ? `<br><small>${s}</small>` : ''}</div>`;

function pagGiorno(k){
  const G = giorno(k);
  const att = G.R.map(({ a, r }) => ({ a, f: flags(r) })).filter(x => x.f.length);
  return `<div class="page">${testata('Report giornaliero', cap(dLabel(k)) + ' · ' + esc(G.p.tipo || 'giornata non programmata') + (G.p.rpe != null ? ' · RPE obiettivo ' + G.p.rpe : ''))}
  <div class="rk">${rk('Disponibili', G.disp + '/' + G.A.length, G.nd.length ? 'non disponibili: ' + G.nd.length : 'nessun assente')}
    ${rk('RPE medio', fmtN(avg(G.rpes), 1), G.diff == null ? 'obiettivo ' + (G.p.rpe ?? '–') : (G.diff >= 0 ? '+' : '') + fmtN(G.diff, 1) + ' vs obiettivo')}
    ${rk('Carico medio', fmtN(avg(G.aus)) + ' AU', 'totale ' + fmtN(sum(G.aus)) + ' AU')}
    ${rk('TQR medio', fmtN(G.tqr, 1), 'compilati PRE ' + G.pre + ' · POST ' + G.post)}</div>
  <div class="rt">Dettaglio atleti</div>
  <table><tr><th>Atleta</th><th>Disponibilità</th><th>TQR</th><th>Sonno</th><th>Ore</th><th>DOMS</th><th>Stress</th><th>Minuti</th><th>RPE</th><th>AU</th></tr>
  ${G.R.map(({ a, r }) => `<tr><td class="nm">${esc(a.nome)}</td><td>${pill(r.disp)}</td>
    <td>${cell('tqr', num(r.tqr))}</td><td>${cell('sonnoQ', num(r.sonnoQ))}</td><td>${cell('sonnoH', num(r.sonnoH))}</td><td>${cell('doms', num(r.doms))}</td><td>${cell('stress', num(r.stress))}</td>
    <td>${num(r.tot) ?? '–'}</td><td><b>${num(r.rpe) ?? '–'}</b></td><td><b>${fmtN(num(r.au))}</b></td></tr>`).join('')}</table>
  <div class="rt">Da monitorare</div>
  ${att.length ? att.map(x => `<div class="note"><b>${esc(x.a.nome)}</b>: ${x.f.join(', ')}</div>`).join('') : '<div class="note">Nessun segnale di allarme sul benessere.</div>'}
  ${G.nd.length ? `<div class="note"><b>Non disponibili</b>: ${G.nd.map(x => esc(x.a.nome) + ' (' + esc(x.r.disp.toLowerCase()) + ')').join(', ')}</div>` : ''}
  ${piede()}</div>`;
}

function pagSettimana(k){
  const lun = lunedi(k), dom = addDays(lun, 6), days = [...Array(7)].map((_, i) => addDays(lun, i));
  const A = attivi();
  const perGiorno = days.map(d => { const G = giorno(d); return { d, G }; });
  const rowsA = A.map(a => {
    const rs = days.map(d => row(d, a.id) || {});
    const aus = rs.map(r => num(r.au)).filter(v => v != null), m = metrics(a.id, dom);
    return { a, sed: aus.length, min: sum(rs.map(r => num(r.tot) || 0)), au: sum(aus), rpe: avg(rs.map(r => num(r.rpe)).filter(v => v != null)),
      tqr: avg(rs.map(r => num(r.tqr)).filter(v => v != null)), nd: rs.filter(r => ND.includes(r.disp)).length, m };
  });
  const tot = sum(rowsA.map(x => x.au));
  return `<div class="page">${testata('Report settimanale', 'Da ' + dLabel(lun, { weekday: 'long', day: 'numeric', month: 'long' }) + ' a ' + dLabel(dom, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }))}
  <div class="rk">${rk('Carico squadra', fmtN(tot) + ' AU', 'media per atleta ' + fmtN(A.length ? tot / A.length : null))}
    ${rk('Sedute registrate', sum(rowsA.map(x => x.sed)), 'su ' + A.length + ' atleti')}
    ${rk('RPE medio', fmtN(avg(rowsA.map(x => x.rpe).filter(v => v != null)), 1), '')}
    ${rk('Giorni non disponibili', sum(rowsA.map(x => x.nd)), 'somma di tutti gli atleti')}</div>
  <div class="rt">Carico medio squadra per giorno (AU)</div>
  ${chartSquadra(days, 698, 170, { fixed: true, fs: 11, lab: d => cap(dLabel(d, { weekday: 'short', day: 'numeric' })) })}
  <table style="margin-top:6px"><tr><th>Giorno</th><th>Tipo</th><th>RPE obiettivo</th><th>RPE medio</th><th>Differenza</th><th>Disponibili</th><th>PRE / POST</th></tr>
  ${perGiorno.map(({ d, G }) => `<tr><td class="nm">${cap(dLabel(d, { weekday: 'short', day: 'numeric', month: 'short' }))}</td><td>${esc(G.p.tipo || '–')}</td><td>${G.p.rpe ?? '–'}</td><td>${fmtN(avg(G.rpes), 1)}</td>
    <td>${G.diff == null ? '–' : `<span class="c ${Math.abs(G.diff) > 1.5 ? 'r' : Math.abs(G.diff) > 0.75 ? 'y' : 'g'}">${G.diff >= 0 ? '+' : ''}${fmtN(G.diff, 1)}</span>`}</td>
    <td>${G.pre ? G.disp + '/' + G.A.length : '–'}</td><td>${G.pre}/${G.post}</td></tr>`).join('')}</table>
  <div class="rt">Atleti</div>
  <table><tr><th>Atleta</th><th>Sedute</th><th>Minuti</th><th>Carico AU</th><th>RPE medio</th><th>TQR medio</th><th>ACWR</th><th>Monotony</th><th>Strain</th><th>Giorni ND</th></tr>
  ${rowsA.map(x => `<tr><td class="nm">${esc(x.a.nome)}</td><td>${x.sed}</td><td>${fmtN(x.min)}</td><td><b>${fmtN(x.au)}</b></td><td>${fmtN(x.rpe, 1)}</td><td>${cell('tqr', x.tqr, 1)}</td>
    <td>${x.m.acwr == null ? '–' : `<span class="c ${x.m.giorni < 21 ? '' : acwCls(x.m.acwr)}">${fmtN(x.m.acwr, 2)}</span>`}</td>
    <td>${x.m.mono == null ? '–' : `<span class="c ${x.m.mono > 2 ? 'r' : 'g'}">${fmtN(x.m.mono, 2)}</span>`}</td><td>${fmtN(x.m.strain)}</td><td>${x.nd || '–'}</td></tr>`).join('')}</table>
  <div class="legend">ACWR (media 7 gg / media 28 gg): verde 0,8–1,3 · giallo fuori zona · rosso &gt; 1,5. Senza colore se ci sono meno di 3 settimane di dati. Monotony &gt; 2 = carico poco variato.</div>
  ${piede()}</div>`;
}

function pagAtleta(id, end){
  const a = D.atleti.find(x => x.id === id); if (!a) return '';
  const m = metrics(id, end);
  const sett = [3, 2, 1, 0].map(w => {
    const fine = addDays(end, -7 * w), days = [...Array(7)].map((_, i) => addDays(fine, i - 6)), rs = days.map(d => row(d, id) || {});
    const mm = f => avg(rs.map(r => num(r[f])).filter(v => v != null));
    return { lab: dLabel(days[0], { day: 'numeric', month: 'short' }) + ' – ' + dLabel(fine, { day: 'numeric', month: 'short' }),
      au: sum(rs.map(r => num(r.au) || 0)), min: sum(rs.map(r => num(r.tot) || 0)), rpe: mm('rpe'), tqr: mm('tqr'), sh: mm('sonnoH'), doms: mm('doms'), stress: mm('stress'),
      nd: rs.filter(r => ND.includes(r.disp)).length };
  });
  const ultimi = [...Array(7)].map((_, i) => addDays(end, -i)).map(d => ({ d, r: row(d, id) || {} }));
  const ndList = [...Array(28)].map((_, i) => addDays(end, -i)).map(d => ({ d, r: row(d, id) || {} })).filter(x => ND.includes(x.r.disp));
  return `<div class="page">${testata(esc(a.nome), 'Scheda atleta · ultimi 28 giorni fino a ' + dLabel(end, { day: 'numeric', month: 'long', year: 'numeric' }))}
  <div class="rk">${rk('Carico 7 gg', fmtN(m.s7) + ' AU', fmtN(m.min) + ' minuti')}
    ${rk('ACWR', m.acwr == null ? '–' : fmtN(m.acwr, 2), m.giorni < 21 ? 'dati ancora pochi' : m.acwr > 1.5 ? 'carico in forte aumento' : m.acwr < 0.8 ? 'carico in calo' : 'in zona')}
    ${rk('TQR medio 7 gg', fmtN(m.tqr, 1), 'sonno ' + fmtN(m.sonnoH, 1) + ' h')}
    ${rk('DOMS / Stress', fmtN(m.doms, 1) + ' / ' + fmtN(m.stress, 1), 'media 7 gg')}</div>
  <div class="rt">Andamento carico e recupero</div>
  ${chartAtleta(id, end, 698, 170, true)}
  <div class="rt">Per settimana</div>
  <table><tr><th>Settimana</th><th>Carico AU</th><th>Minuti</th><th>RPE medio</th><th>TQR</th><th>Ore sonno</th><th>DOMS</th><th>Stress</th><th>Giorni ND</th></tr>
  ${sett.map(s => `<tr><td class="nm">${s.lab}</td><td><b>${fmtN(s.au)}</b></td><td>${fmtN(s.min)}</td><td>${fmtN(s.rpe, 1)}</td><td>${cell('tqr', s.tqr, 1)}</td><td>${cell('sonnoH', s.sh, 1)}</td><td>${cell('doms', s.doms, 1)}</td><td>${cell('stress', s.stress, 1)}</td><td>${s.nd || '–'}</td></tr>`).join('')}</table>
  <div class="rt">Ultimi 7 giorni</div>
  <table><tr><th>Giorno</th><th>Disponibilità</th><th>TQR</th><th>Sonno</th><th>Ore</th><th>DOMS</th><th>Stress</th><th>Minuti</th><th>RPE</th><th>AU</th></tr>
  ${ultimi.map(({ d, r }) => `<tr><td class="nm">${cap(dLabel(d, { weekday: 'short', day: 'numeric', month: 'short' }))}</td><td>${r.disp ? pill(r.disp) : '<span class="muted">–</span>'}</td>
    <td>${cell('tqr', num(r.tqr))}</td><td>${cell('sonnoQ', num(r.sonnoQ))}</td><td>${cell('sonnoH', num(r.sonnoH))}</td><td>${cell('doms', num(r.doms))}</td><td>${cell('stress', num(r.stress))}</td>
    <td>${num(r.tot) ?? '–'}</td><td>${num(r.rpe) ?? '–'}</td><td><b>${fmtN(num(r.au))}</b></td></tr>`).join('')}</table>
  ${ndList.length ? `<div class="note"><b>Non disponibile</b> negli ultimi 28 giorni: ${ndList.map(x => dLabel(x.d, { day: 'numeric', month: 'short' }) + ' (' + esc(x.r.disp.toLowerCase()) + ')').join(', ')}</div>` : ''}
  ${piede()}</div>`;
}

async function scaricaPdf(){
  const btn = $('#pdfBtn'); btn.disabled = true; btn.textContent = 'Creo il PDF…';
  const nome = { giorno: 'giornaliero_' + cur, settimana: 'settimana_' + lunedi(cur), atleta: 'atleta_' + repAtleta + '_' + cur, completo: 'completo_' + cur }[repTipo];
  // copia delle pagine in un contenitore pulito: 794×1123 px per pagina (A4)
  const box = document.createElement('div');
  box.className = 'pdf';
  box.style.cssText = 'width:794px;background:#fff';
  box.innerHTML = $('#rep').innerHTML;
  document.body.appendChild(box);
  try {
    if (!window.html2pdf) throw new Error('libreria PDF non caricata');
    await html2pdf().set({
      margin: 0, filename: 'Report_' + SQ + '_' + nome + '.pdf',
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 },
      jsPDF: { unit: 'px', format: [794, 1123], orientation: 'portrait', hotfixes: ['px_scaling'] },
      pagebreak: { mode: [] }
    }).from(box).save();
  } catch (e) { toast('Errore PDF: ' + e.message); }
  box.remove();
  btn.disabled = false; btn.textContent = 'Scarica PDF';
}

const CARICAMENTI = [
  'Sto stagionando i dati come un Asiago Stravecchio…',
  'Salgo verso l\'Ortigara, un attimo…',
  'Marla sta riportando i dati (forse)…',
  'Controllo la nebbia sull\'Altopiano…',
  'Carico i dati e una fetta di Asiago…'
];
const CALZINI = [
  'Marla ha trovato un calzino… ora si sente libera 🧦',
  'Marla approva con le orecchie 🐾',
  'Salvato in cima al Verena ⛰️',
  'Dato stagionato 24 mesi 🧀',
  'Marla ha nascosto il backup sotto il divano'
];
let EGG = false;
try { EGG = localStorage.getItem('agenda_egg') === '1'; } catch (_) {}
const pick = a => a[Math.floor(Math.random() * a.length)];
function okToast(msg){ toast(EGG && Math.random() < 0.3 ? msg + ' · ' + pick(CALZINI) : msg, EGG ? 3600 : 2600); }

function saluto(){
  const h = new Date().getHours();
  if (h < 6) return 'Ancora sveglio? Anche Marla dorme da un pezzo 💤';
  if (h < 10) return 'Buongiorno! Nebbia sull\'Altopiano, ma i dati sono limpidi ☕';
  if (h < 14) return 'Mezzogiorno: ora perfetta per pane e Asiago 🧀';
  if (h < 19) return 'Pomeriggio da allenamento: Marla scalda le zampe 🏀';
  if (h < 23) return 'Sera: Marla aspetta il POST sul divano 🛋️';
  return 'Ancora qui? Anche Marla dorme da un pezzo 💤';
}
function applicaEgg(){
  document.body.classList.toggle('egg', EGG);
  if (EGG && !document.querySelector('.alp')) document.body.insertAdjacentHTML('afterbegin', ALTOPIANO_SVG);
  const b = $('#eggBtn'); if (b) b.classList.toggle('on', EGG);
  const sl = $('#saluto'); if (sl && !RO) sl.textContent = EGG ? saluto() : '';
}
function toggleEgg(){
  EGG = !EGG;
  try { localStorage.setItem('agenda_egg', EGG ? '1' : '0'); } catch (_) {}
  applicaEgg();
  if (D) render();
  toast(EGG ? 'Modalità Marla attivata 🐾 · prova a scrivere "marla"' : 'Modalità Marla in cuccia 💤', 3600);
  if (EGG) setTimeout(spunta, 500);
}

// Marla fa capolino dal basso
function spunta(){
  if (document.querySelector('.peek')) return;
  const d = document.createElement('div'); d.className = 'peek'; d.innerHTML = MARLA_SVG;
  document.body.appendChild(d);
  requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('up')));
  setTimeout(() => d.classList.remove('up'), 2200);
  setTimeout(() => d.remove(), 2900);
}
let clickTitolo = [];
function cliccaTitolo(){
  if (!EGG) return;
  const t = Date.now(); clickTitolo = clickTitolo.filter(x => t - x < 2000).concat(t);
  if (clickTitolo.length >= 5) { clickTitolo = []; spunta(); }
}

// Scrivi "marla": corre per la pagina palleggiando
function corsa(){
  if (document.querySelector('.corsa')) return;
  const d = document.createElement('div'); d.className = 'corsa';
  d.innerHTML = `<div class="h">${MARLA_SVG}</div><div class="b">${PALLA_SVG}</div>`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 4400);
}
let tasti = '';
document.addEventListener('keydown', e => {
  if (!EGG || e.target.matches('input, select, textarea')) return;
  tasti = (tasti + (e.key || '').toLowerCase()).slice(-5);
  if (tasti === 'marla') { tasti = ''; corsa(); }
});

// Tutti hanno fatto PRE e POST: timbro e pioggia di zampe
const festeggiato = {};
function controllaApprovazione(){
  if (!EGG || !D || cur !== D.oggi || festeggiato[cur]) return;
  const R = giorno(cur).R;
  if (!R.length || !R.every(x => num(x.r.tqr) != null && (num(x.r.rpe) != null || ND.includes(x.r.disp)))) return;
  festeggiato[cur] = true;
  const t = document.createElement('div'); t.className = 'timbro';
  t.innerHTML = 'Marla approva 🐾<small>Tutti hanno compilato PRE e POST</small>';
  document.body.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
  for (let i = 0; i < 26; i++) {
    const z = document.createElement('div'); z.className = 'zampa'; z.textContent = pick(['🐾', '🐾', '🏀', '🧀']);
    z.style.left = Math.random() * 100 + 'vw'; z.style.animationDuration = (2.2 + Math.random() * 2) + 's'; z.style.animationDelay = Math.random() * 1.2 + 's';
    document.body.appendChild(z); setTimeout(() => z.remove(), 5000);
  }
  setTimeout(() => t.classList.remove('show'), 2600);
  setTimeout(() => t.remove(), 3200);
}
